doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        charset: utf8mb4
        profiling_collect_backtrace: '%kernel.debug%'
        options:
            !php/const PDO::ATTR_TIMEOUT: 2
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        mappings:
            Organizations:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Organizations/Domain/Entity'
                prefix: 'App\Organizations\Domain\Entity'
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Domain/Entity'
                prefix: 'App\Identity\Domain\Entity'
            Projects:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Projects/Domain/Entity'
                prefix: 'App\Projects\Domain\Entity'
            Contractors:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Contractors/Domain/Entity'
                prefix: 'App\Contractors\Domain\Entity'
            Permits:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Permits/Domain/Entity'
                prefix: 'App\Permits\Domain\Entity'

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'
